<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Miles runs</title><style>
body{font:15px system-ui;max-width:1100px;margin:40px auto;padding:0 20px;color:#231f1c;background:#faf9f6}input{padding:10px;width:95%;margin:15px 0}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:14px 10px;border-bottom:1px solid #ddd}a{color:#287bdd}small{color:#777}details{margin-top:30px}
</style></head><body><h1>Miles · Runs</h1><p>Select a run to view training metrics, GPU timelines, and the data pool. Refreshes every 15 seconds.</p><input id="filter" placeholder="Search runs"><p id="status">Loading…</p><table><thead><tr><th>Run</th><th>Start time</th></tr></thead><tbody id="rows"></tbody></table><details><summary>Runs without dashboard data</summary><p>These runs have no dashboard records available.</p><ul id="missing"></ul></details><script>
let runs=[];const rows=document.querySelector('#rows');function render(){rows.replaceChildren();for(const r of runs.filter(r=>(r.name+' '+r.path).toLowerCase().includes(document.querySelector('#filter').value.toLowerCase()))){const tr=document.createElement('tr'),td=document.createElement('td'),a=document.createElement('a'),small=document.createElement('small'),date=document.createElement('td');a.href='/runs/'+r.id+'/';a.textContent=r.name;small.textContent=r.path;td.append(a,document.createElement('br'),small);date.textContent=new Date(r.start_ts*1000).toLocaleString();tr.append(td,date);rows.append(tr);}}
async function refresh(){try{const response=await fetch('/api/runs');if(!response.ok)throw Error(response.status);const data=await response.json();runs=data.runs;document.querySelector('#status').textContent=runs.length + (runs.length === 1 ? ' run available' : ' runs available');render();const list=document.querySelector('#missing');list.replaceChildren();for(const path of data.without_telemetry){const li=document.createElement('li');li.textContent=path;list.append(li);}}catch(e){document.querySelector('#status').textContent='Failed to load runs: '+e.message;}}document.querySelector('#filter').oninput=render;refresh();setInterval(refresh,15000);
</script></body></html>
